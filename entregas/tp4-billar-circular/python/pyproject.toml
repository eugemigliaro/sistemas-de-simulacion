[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tp4analysis"
version = "1.0.0"
description = "Post-proceso y animación del TP4, independientes del motor"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "imageio-ffmpeg"]

[tool.setuptools.packages.find]
where = ["src"]
